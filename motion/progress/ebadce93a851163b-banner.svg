<svg xmlns="http://www.w3.org/2000/svg" width="300" height="64" viewBox="0 0 300 64" role="img" aria-label="Deploying">
  <title>Deploying</title>
  <defs>
    <!-- Clip the icon area so animations (e.g. the running.svg van drive-off) don't bleed into the text. -->
    <clipPath id="digg-icon-clip">
      <rect x="0" y="0" width="64" height="64"/>
    </clipPath>
  </defs>
  <style>
    /* Van bounces; speed lines are outside van-group so they stay level */
    .van-group { animation: digg-bounce .4s ease-in-out infinite alternate; }
    @keyframes digg-bounce { to { transform: translateY(-2px); } }

    .van { fill: none; stroke: #E32D22; stroke-width: 2.5; stroke-linejoin: round; }

    .wheel { transform-box: fill-box; transform-origin: center;
             animation: digg-spin .7s linear infinite; }
    .wheel circle { fill: none; stroke: #E32D22; stroke-width: 2.5; }
    .wheel line   { stroke: #E32D22; stroke-width: 1.5; stroke-linecap: round; }
    @keyframes digg-spin { to { transform: rotate(360deg); } }

    /* Speed lines emerge from behind van and fade left */
    .speed { stroke: #E32D22; stroke-linecap: round;
             animation: digg-speed .55s linear infinite; }
    .speed:nth-child(2) { animation-delay: .18s; }
    .speed:nth-child(3) { animation-delay: .36s; }
    @keyframes digg-speed {
      from { transform: translateX(6px); opacity: .85; }
      to   { transform: translateX(0);   opacity:   0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .van-group { animation: none; }
      .wheel     { animation: none; }
      .speed     { animation: none; opacity: 0; }
    }
    </style>
  <g clip-path="url(#digg-icon-clip)">
    <!-- Speed lines (level, outside van-group) -->
  <g>
    <line class="speed" x1="0" y1="24" x2="9"  y2="24" stroke-width="2"/>
    <line class="speed" x1="0" y1="30" x2="11" y2="30" stroke-width="2.5"/>
    <line class="speed" x1="0" y1="36" x2="8"  y2="36" stroke-width="1.5"/>
  </g>

  <g class="van-group">
    <!-- Cargo box (clean single shape) -->
    <rect class="van" x="14" y="16" width="32" height="24"/>
    <!-- Digg wordmark centered in cargo -->
    <text x="30" y="30"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="10" font-weight="700"
          text-anchor="middle" dominant-baseline="central"
          fill="#E32D22">Digg</text>

    <!-- Cab (clean single shape: step-down roofline + sloped windshield) -->
    <path class="van" d="M46,22 L50,22 L61,28 L61,40 L46,40 Z"/>
    <!-- Headlight on front face -->
    <rect x="58" y="34" width="3" height="3" rx="1" fill="#E32D22"/>

    <!-- Rear wheel -->
    <g class="wheel">
      <circle cx="22" cy="46" r="6"/>
      <line x1="22" y1="40" x2="22" y2="52"/>
      <line x1="16" y1="46" x2="28" y2="46"/>
    </g>
    <!-- Front wheel -->
    <g class="wheel">
      <circle cx="54" cy="46" r="6"/>
      <line x1="54" y1="40" x2="54" y2="52"/>
      <line x1="48" y1="46" x2="60" y2="46"/>
    </g>
  </g>
  </g>
  <line x1="71" y1="10" x2="71" y2="54" stroke="#E32D22" stroke-width="1" opacity="0.2"/>
  <text x="82" y="24" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E32D22" dominant-baseline="central">Deploying</text>
  <text x="82" y="44" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#E32D22" opacity="0.6" dominant-baseline="central">Step 3 of 5</text>
</svg>
