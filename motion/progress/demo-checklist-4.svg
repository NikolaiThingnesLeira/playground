<svg xmlns="http://www.w3.org/2000/svg" width="360" height="222" viewBox="0 0 360 222" role="img" aria-label="Progress checklist: 3 of 5 steps complete">
  <title>Progress</title>
  <style>
    .cur-ring, .cur-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: digg-pulse 1.4s ease-in-out infinite;
    }
    @keyframes digg-pulse {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.2); }
    }
    .new-done {
      animation: digg-slide-in 0.45s ease-out both;
    }
    @keyframes digg-slide-in {
      from { transform: translateX(-8px); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cur-ring, .cur-dot { animation: none; }
      .new-done           { animation: none; }
    }
  </style>
  <line x1="28" y1="45.0" x2="28" y2="63.0" stroke="#E32D22" stroke-width="1.5" opacity="0.2"/>
  <line x1="28" y1="83.0" x2="28" y2="101.0" stroke="#E32D22" stroke-width="1.5" opacity="0.2"/>
  <line x1="28" y1="121.0" x2="28" y2="139.0" stroke="#E32D22" stroke-width="1.5" opacity="0.2"/>
  <line x1="28" y1="159.0" x2="28" y2="177.0" stroke="#E32D22" stroke-width="1.5" opacity="0.2"/>
  <g><circle cx="28" cy="35" r="8" fill="#E32D22"/><path d="M 25.5 35.0 L 27.8 37.5 L 31.0 32.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="45" y="35" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#E32D22" dominant-baseline="central">Provisioning</text></g>
  <g><circle cx="28" cy="73" r="8" fill="#E32D22"/><path d="M 25.5 73.0 L 27.8 75.5 L 31.0 70.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="45" y="73" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#E32D22" dominant-baseline="central">Syncing</text></g>
  <g class="new-done"><circle cx="28" cy="111" r="8" fill="#E32D22"/><path d="M 25.5 111.0 L 27.8 113.5 L 31.0 108.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="45" y="111" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#E32D22" dominant-baseline="central">Deploying</text></g>
  <g><circle cx="28" cy="149" r="8" fill="none" stroke="#E32D22" stroke-width="2.5" class="cur-ring"/><circle cx="28" cy="149" r="3.2" fill="#E32D22" class="cur-dot"/><text x="45" y="149" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#E32D22" dominant-baseline="central">Running tests</text></g>
  <g><circle cx="28" cy="187" r="8" fill="none" stroke="#E32D22" stroke-width="2" opacity="0.3"/><text x="45" y="187" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#E32D22" opacity="0.3" dominant-baseline="central">Ready</text></g>
</svg>
