<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Running">
  <title>Running</title>
  <style>
    .van { fill: none; stroke: #E32D22; stroke-width: 2.5; stroke-linejoin: round; }

    .van-drive {
      animation: digg-drive 1.4s ease-in forwards;
    }
    @keyframes digg-drive {
      from { transform: translateX(0);    }
      to   { transform: translateX(80px); }
    }

    .van-bounce {
      animation: digg-bounce 0.4s ease-in-out infinite alternate;
    }
    @keyframes digg-bounce { to { transform: translateY(-2px); } }

    .wheel { transform-box: fill-box; transform-origin: center;
             animation: digg-spin 0.7s linear infinite; }
    .wheel circle { fill: none; stroke: #E32D22; stroke-width: 2.5; }
    .wheel line   { stroke: #E32D22; stroke-width: 1.5; stroke-linecap: round; }
    @keyframes digg-spin { to { transform: rotate(360deg); } }

    /* Package: hidden high inside cargo, drops out, then zooms to fill frame */
    .pkg-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: digg-deliver 2.2s ease-out 0.3s both;
    }
    @keyframes digg-deliver {
      0%   { transform: translateY(-22px) scale(1);   opacity: 0; }
      20%  { opacity: 1; }
      38%  { transform: translateY(2px)   scale(1); }
      48%  { transform: translateY(0)     scale(1); }
      56%  { transform: translateY(0)     scale(1); }
      88%  { transform: translateY(0)     scale(1.9); }
      100% { transform: translateY(0)     scale(1.9); }
    }

    @media (prefers-reduced-motion: reduce) {
      .van-drive  { animation: none; transform: translateX(80px); }
      .van-bounce { animation: none; }
      .wheel      { animation: none; }
      .pkg-group  { animation: none; opacity: 1;
                    transform: translateY(0) scale(1.9); }
    }
  </style>

  <!-- Package drawn FIRST — van covers it until it drives away -->
  <g class="pkg-group">
    <rect x="28" y="41" width="16" height="11" rx="1" fill="none" stroke="#E32D22" stroke-width="2"/>
    <text x="36" y="47"
          font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="7" font-weight="700"
          text-anchor="middle" dominant-baseline="central"
          fill="#E32D22">Digg</text>
  </g>

  <!-- Van (drives off right, wheels spin, body bounces) -->
  <g class="van-drive">
    <g class="van-bounce">
      <rect class="van" x="14" y="16" width="32" height="24"/>
      <path class="van" d="M46,22 L50,22 L61,28 L61,40 L46,40 Z"/>
      <rect x="58" y="34" width="3" height="3" rx="1" fill="#E32D22"/>
      <g class="wheel">
        <circle cx="22" cy="46" r="6"/>
        <line x1="22" y1="40" x2="22" y2="52"/>
        <line x1="16" y1="46" x2="28" y2="46"/>
      </g>
      <g class="wheel">
        <circle cx="54" cy="46" r="6"/>
        <line x1="54" y1="40" x2="54" y2="52"/>
        <line x1="48" y1="46" x2="60" y2="46"/>
      </g>
    </g>
  </g>
</svg>
